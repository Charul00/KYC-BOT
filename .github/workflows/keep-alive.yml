# ============================================================
# keep-alive.yml
# Pings the Render backend every 14 minutes so it never sleeps.
# Render free tier sleeps after 15 min of no traffic.
# This GitHub Action runs 24/7 for FREE on GitHub's servers.
# ============================================================

name: 🔔 Keep Render Alive

on:
  schedule:
    # Every 14 minutes — just under Render's 15-min sleep threshold
    - cron: '*/14 * * * *'

  # Allow manual trigger from GitHub Actions tab anytime
  workflow_dispatch:

jobs:
  ping:
    name: Ping Health Endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: 🏓 Ping Render backend
        run: |
          echo "Pinging: https://kyc-chatbot-api.onrender.com/health"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 60 \
            https://kyc-chatbot-api.onrender.com/health)
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" = "200" ]; then
            echo "✅ Backend is alive!"
          else
            echo "⚠️  Unexpected status $STATUS — backend may be starting up"
          fi

      - name: 📊 Show timestamp
        run: echo "Pinged at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
